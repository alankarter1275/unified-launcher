[package]
name = "unified-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
fuzzy-matcher = "0.3.7"
zbus = { version = "3.14", features = ["tokio"] }
futures-util = "0.3"
meval = "0.2"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["clock"] }
aes-gcm = "0.11.1"
pbkdf2 = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
rand = "0.8"

[[bin]]
name = "daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "polkit-client"
path = "src/bin/polkit_client.rs"

[build-dependencies]
slint-build = "1.8.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
