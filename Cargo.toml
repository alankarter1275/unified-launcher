[package]
name = "unified-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.5.0"
tokio = { version = "1.37", features = [
  "rt-multi-thread",
  "net",
  "macros",
  "io-util",
  "fs",
  "sync",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fuzzy-matcher = "0.3.7"
image = "0.24.7"

[[bin]]
name = "daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[build-dependencies]
slint-build = "1.5.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
