[package]
name = "unified-launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
fuzzy-matcher = "0.3.7"
zbus = { version = "3.14", features = ["tokio"] }
futures-util = "0.3"

[[bin]]
name = "daemon"
path = "src/bin/daemon.rs"

[[bin]]
name = "client"
path = "src/bin/client.rs"

[[bin]]
name = "polkit-client"
path = "src/bin/polkit_client.rs"

[build-dependencies]
slint-build = "1.8.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
